<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UijeongBoo - 스크롤 애니메이션 가이드</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
    
    <style>
        :root {
            --uij-primary: #32CD32;
            --uij-bg-primary: #222222;
            --uij-bg-secondary: #333333;
            --uij-bg-tertiary: #444444;
            --uij-text-primary: #eeeeee;
            --uij-text-secondary: #cccccc;
            --uij-border: #444444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--uij-bg-primary);
            color: var(--uij-text-primary);
            line-height: 1.6;
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--uij-bg-secondary);
            z-index: 1000;
        }

        .progress-bar {
            height: 100%;
            background: var(--uij-primary);
            width: 0%;
            transition: width 0.1s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero-section {
            padding: 80px 0;
            text-align: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .hero-content {
            width: 100%;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--uij-primary);
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: var(--uij-text-secondary);
            margin-bottom: 40px;
        }

        .components-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin: 80px 0;
        }

        .component-card {
            background: var(--uij-bg-secondary);
            border: 1px solid var(--uij-border);
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .component-card:hover {
            border-color: var(--uij-primary);
            transform: translateY(-5px);
        }

        .component-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--uij-text-primary);
            margin-bottom: 10px;
        }

        .component-description {
            color: var(--uij-text-secondary);
            margin-bottom: 20px;
        }

        .demo-preview {
            background: var(--uij-bg-primary);
            border: 1px solid var(--uij-border);
            border-radius: 8px;
            padding: 20px;
            margin: 16px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .demo-element {
            width: 60px;
            height: 60px;
            background: var(--uij-primary);
            border-radius: 8px;
            transition: all 0.6s ease;
        }

        .component-card:hover .demo-element {
            transform: scale(1.1) rotate(10deg);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--uij-bg-primary);
            border: 1px solid var(--uij-border);
            border-radius: 12px;
            width: 90vw;
            max-width: 1000px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--uij-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: transparent;
            border: 1px solid var(--uij-border);
            color: var(--uij-text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        .modal-close:hover {
            border-color: var(--uij-primary);
            color: var(--uij-primary);
        }

        .modal-body {
            padding: 20px;
        }

        .demo-page {
            width: 100%;
            height: 500px;
            border: 1px solid var(--uij-border);
            border-radius: 8px;
            background: var(--uij-bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .components-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                width: 95vw;
                max-height: 90vh;
            }
            
            .modal-body {
                padding: 15px;
            }
            
            .demo-page {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <!-- 스크롤 진행률 표시 -->
    <div class="scroll-progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- 히어로 섹션 -->
    <section class="hero-section">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">스크롤 애니메이션 가이드</h1>
                <p class="hero-subtitle">15가지 매력적인 스크롤 애니메이션 패턴</p>
            </div>
        </div>
    </section>

    <!-- 컴포넌트 그리드 -->
    <section class="container">
        <div class="components-grid">
            <div class="component-card" onclick="openModal('classic')">
                <h3 class="component-title">클래식 접근법</h3>
                <p class="component-description">기본적이지만 강력한 페이드 인 효과</p>
                <div class="demo-preview">
                    <div class="demo-element"></div>
                </div>
            </div>

            <div class="component-card" onclick="openModal('parallax')">
                <h3 class="component-title">패럴랙스 레이어링</h3>
                <p class="component-description">깊이감 있는 다층 스크롤 효과</p>
                <div class="demo-preview">
                    <div class="demo-element"></div>
                </div>
            </div>

            <div class="component-card" onclick="openModal('magnetic')">
                <h3 class="component-title">마그네틱 스크롤</h3>
                <p class="component-description">마우스에 반응하는 자석 효과</p>
                <div class="demo-preview">
                    <div class="demo-element"></div>
                </div>
            </div>

            <div class="component-card" onclick="openModal('morphing')">
                <h3 class="component-title">모핑 애니메이션</h3>
                <p class="component-description">스크롤에 따라 모양이 변화</p>
                <div class="demo-preview">
                    <div class="demo-element"></div>
                </div>
            </div>

            <div class="component-card" onclick="openModal('liquid')">
                <h3 class="component-title">리퀴드 모션</h3>
                <p class="component-description">액체같은 부드러운 변형</p>
                <div class="demo-preview">
                    <div class="demo-element"></div>
                </div>
            </div>

            <div class="component-card" onclick="openModal('physics')">
                <h3 class="component-title">물리 기반 스크롤</h3>
                <p class="component-description">실제 바운스와 드래그 효과</p>
                <div class="demo-preview">
                    <div class="demo-element"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- 모달 -->
    <div id="demoModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">데모 제목</h2>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="demo-page" id="demoArea">
                    실제 스크롤 효과가 여기에 표시됩니다
                </div>
                <p>이 효과는 실제 웹사이트에서 스크롤 인터랙션으로 구현할 수 있습니다.</p>
            </div>
        </div>
    </div>

    <script>
        // 스크롤 진행률 업데이트
        function updateScrollProgress() {
            const scrolled = window.pageYOffset;
            const maxHeight = document.documentElement.scrollHeight - window.innerHeight;
            const progress = (scrolled / maxHeight) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // 모달 열기
        function openModal(type) {
            const modal = document.getElementById('demoModal');
            const title = document.getElementById('modalTitle');
            const demoArea = document.getElementById('demoArea');
            
            title.textContent = '실제 스크롤 애니메이션 데모';
            
            if (type === 'classic') {
                demoArea.innerHTML = `
                    <div style="height: 450px; overflow-y: scroll; border: 1px solid var(--uij-border); border-radius: 8px; background: var(--uij-bg-primary);">
                        <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
                            <div class="fade-demo" style="opacity: 0; transform: translateY(50px); transition: all 0.8s ease; width: 200px; height: 200px; background: var(--uij-primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 1.2rem;">페이드 인</div>
                        </div>
                        <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
                            <div class="fade-demo" style="opacity: 0; transform: translateY(50px); transition: all 0.8s ease; width: 200px; height: 200px; background: var(--uij-primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 1.2rem;">두 번째</div>
                        </div>
                        <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
                            <div class="fade-demo" style="opacity: 0; transform: translateY(50px); transition: all 0.8s ease; width: 200px; height: 200px; background: var(--uij-primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; font-size: 1.2rem;">세 번째</div>
                        </div>
                    </div>
                `;
                
                const scrollContainer = demoArea.querySelector('div');
                const fadeElements = demoArea.querySelectorAll('.fade-demo');
                
                scrollContainer.addEventListener('scroll', () => {
                    fadeElements.forEach(el => {
                        const rect = el.getBoundingClientRect();
                        const containerRect = scrollContainer.getBoundingClientRect();
                        if (rect.top < containerRect.bottom - 100) {
                            el.style.opacity = '1';
                            el.style.transform = 'translateY(0)';
                        }
                    });
                });
            }
            else if (type === 'parallax') {
                demoArea.innerHTML = `
                    <div style="height: 600px; overflow-y: scroll; border: 1px solid var(--uij-border); border-radius: 8px; background: var(--uij-bg-primary); position: relative;">
                        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 150%; background: linear-gradient(45deg, var(--uij-primary), #1a8a1a); opacity: 0.3;" id="parallaxBg"></div>
                        <div style="position: relative; z-index: 2; height: 200vh; display: flex; align-items: center; justify-content: center; flex-direction: column;">
                            <h2 style="color: var(--uij-primary); margin-bottom: 20px; font-size: 3rem;">패럴랙스 효과</h2>
                            <p style="font-size: 1.5rem;">스크롤하면 배경이 다른 속도로 움직입니다</p>
                        </div>
                    </div>
                `;
                
                const scrollContainer = demoArea.querySelector('div');
                const parallaxBg = document.getElementById('parallaxBg');
                
                scrollContainer.addEventListener('scroll', () => {
                    const scrollTop = scrollContainer.scrollTop;
                    parallaxBg.style.transform = `translateY(${scrollTop * 0.5}px)`;
                });
            }
            else if (type === 'magnetic') {
                demoArea.innerHTML = `
                    <div style="height: 600px; border: 1px solid var(--uij-border); border-radius: 8px; background: var(--uij-bg-primary); display: flex; align-items: center; justify-content: center; cursor: none; position: relative;" id="magneticContainer">
                        <div style="position: absolute; width: 30px; height: 30px; background: var(--uij-primary); border-radius: 50%; pointer-events: none;" id="magneticCursor"></div>
                        <div style="width: 400px; height: 400px; background: var(--uij-bg-secondary); border: 3px solid var(--uij-primary); border-radius: 20px; display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; font-size: 2rem;" id="magneticEl">마우스를 올려보세요</div>
                    </div>
                `;
                
                const container = document.getElementById('magneticContainer');
                const cursor = document.getElementById('magneticCursor');
                const element = document.getElementById('magneticEl');
                
                container.addEventListener('mousemove', (e) => {
                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    cursor.style.left = x + 'px';
                    cursor.style.top = y + 'px';
                    
                    const elRect = element.getBoundingClientRect();
                    const elCenterX = elRect.left + elRect.width / 2 - rect.left;
                    const elCenterY = elRect.top + elRect.height / 2 - rect.top;
                    const deltaX = (x - elCenterX) * 0.2;
                    const deltaY = (y - elCenterY) * 0.2;
                    element.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.05)`;
                });
                
                container.addEventListener('mouseleave', () => {
                    element.style.transform = 'translate(0, 0) scale(1)';
                });
            }
            else if (type === 'morphing') {
                demoArea.innerHTML = `
                    <div style="height: 600px; overflow-y: scroll; border: 1px solid var(--uij-border); border-radius: 8px; background: var(--uij-bg-primary);">
                        <div style="height: 400vh; display: flex; align-items: center; justify-content: center; position: relative;">
                            <div style="position: sticky; top: 200px; width: 300px; height: 300px; background: var(--uij-primary); display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; transition: all 0.3s ease; font-size: 2rem;" id="morphingEl">모핑</div>
                        </div>
                    </div>
                `;
                
                const scrollContainer = demoArea.querySelector('div');
                const morphingEl = document.getElementById('morphingEl');
                
                scrollContainer.addEventListener('scroll', () => {
                    const scrollTop = scrollContainer.scrollTop;
                    const maxScroll = scrollContainer.scrollHeight - scrollContainer.clientHeight;
                    const progress = scrollTop / maxScroll;
                    
                    const stage = Math.floor(progress * 4);
                    let borderRadius, rotation, scale;
                    
                    switch(stage) {
                        case 0:
                            borderRadius = '12px';
                            rotation = progress * 90;
                            scale = 1;
                            break;
                        case 1:
                            borderRadius = '50%';
                            rotation = 90 + (progress - 0.25) * 4 * 90;
                            scale = 1.2;
                            break;
                        case 2:
                            borderRadius = '0px';
                            rotation = 180 + (progress - 0.5) * 4 * 90;
                            scale = 0.8;
                            break;
                        default:
                            borderRadius = '50% 0';
                            rotation = 270 + (progress - 0.75) * 4 * 90;
                            scale = 1.3;
                    }
                    
                    morphingEl.style.borderRadius = borderRadius;
                    morphingEl.style.transform = `rotate(${rotation}deg) scale(${scale})`;
                });
            }
            else if (type === 'liquid') {
                demoArea.innerHTML = `
                    <div style="height: 600px; overflow-y: scroll; border: 1px solid var(--uij-border); border-radius: 8px; background: var(--uij-bg-primary);">
                        <div style="height: 300vh; display: flex; align-items: center; justify-content: center; position: relative;">
                            <div style="position: sticky; top: 200px; width: 400px; height: 200px; background: var(--uij-primary); border-radius: 100px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; transition: transform 0.1s ease; font-size: 2rem;" id="liquidEl">리퀴드</div>
                        </div>
                    </div>
                `;
                
                const scrollContainer = demoArea.querySelector('div');
                const liquidEl = document.getElementById('liquidEl');
                let lastScrollTop = 0;
                
                scrollContainer.addEventListener('scroll', () => {
                    const scrollTop = scrollContainer.scrollTop;
                    const velocity = scrollTop - lastScrollTop;
                    
                    const intensity = Math.abs(velocity) * 0.1;
                    const skew = Math.max(-15, Math.min(15, velocity * 0.3));
                    const scaleX = 1 + intensity;
                    const scaleY = Math.max(0.7, 1 - intensity * 0.3);
                    
                    liquidEl.style.transform = `skew(${skew}deg) scale(${scaleX}, ${scaleY})`;
                    
                    setTimeout(() => {
                        liquidEl.style.transform = 'skew(0deg) scale(1, 1)';
                    }, 100);
                    
                    lastScrollTop = scrollTop;
                });
            }
            else if (type === 'physics') {
                demoArea.innerHTML = `
                    <div style="height: 600px; border: 1px solid var(--uij-border); border-radius: 8px; background: var(--uij-bg-primary); position: relative; overflow: hidden;" id="physicsContainer">
                        <div style="width: 100px; height: 100px; background: var(--uij-primary); border-radius: 50%; position: absolute; cursor: pointer; top: 50%; left: 50%; transform: translate(-50%, -50%);" id="physicsBall"></div>
                        <div style="position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: var(--uij-text-secondary); font-size: 1.2rem; text-align: center;">공을 드래그하여 물리 효과를 확인하세요</div>
                    </div>
                `;
                
                const ball = document.getElementById('physicsBall');
                const container = document.getElementById('physicsContainer');
                let physics = {
                    x: 250, y: 250,
                    vx: 0, vy: 0,
                    gravity: 0.3,
                    friction: 0.98,
                    bounce: -0.8,
                    isDragging: false
                };
                
                ball.addEventListener('mousedown', (e) => {
                    physics.isDragging = true;
                    physics.vx = 0;
                    physics.vy = 0;
                });
                
                document.addEventListener('mousemove', (e) => {
                    if (physics.isDragging) {
                        const rect = container.getBoundingClientRect();
                        physics.x = e.clientX - rect.left - 50;
                        physics.y = e.clientY - rect.top - 50;
                        updatePosition();
                    }
                });
                
                document.addEventListener('mouseup', () => {
                    physics.isDragging = false;
                });
                
                function animate() {
                    if (!physics.isDragging) {
                        physics.vy += physics.gravity;
                        physics.x += physics.vx;
                        physics.y += physics.vy;
                        
                        if (physics.x <= 0) { physics.x = 0; physics.vx *= physics.bounce; }
                        if (physics.x >= 500) { physics.x = 500; physics.vx *= physics.bounce; }
                        if (physics.y <= 0) { physics.y = 0; physics.vy *= physics.bounce; }
                        if (physics.y >= 500) { physics.y = 500; physics.vy *= physics.bounce; }
                        
                        physics.vx *= physics.friction;
                        physics.vy *= physics.friction;
                        updatePosition();
                    }
                    requestAnimationFrame(animate);
                }
                
                function updatePosition() {
                    ball.style.left = physics.x + 'px';
                    ball.style.top = physics.y + 'px';
                }
                
                animate();
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 모달 닫기
        function closeModal() {
            const modal = document.getElementById('demoModal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 이벤트 리스너
        window.addEventListener('scroll', updateScrollProgress, { passive: true });
        
        // 모달 외부 클릭시 닫기
        document.getElementById('demoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        console.log('UijeongBoo 스크롤 애니메이션 가이드가 로드되었습니다!');
    </script>
</body>
</html>
