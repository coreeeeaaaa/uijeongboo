<!-- UijeongBoo Dual Sidebar Component -->
<!-- Version: 2.0 - Complete Left + Right Sidebar System -->

<style>
/* Main Layout */
.uij-layout {
    display: flex;
    min-height: 100vh;
}

.uij-main-content {
    flex: 1;
    padding: var(--uij-spacing-lg, 24px);
    transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                margin-right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Left Sidebar */
.uij-sidebar-left {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 280px;
    background: var(--uij-bg-secondary, #333333);
    border-right: 1px solid var(--uij-border, #444444);
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1000;
    display: flex;
    flex-direction: column;
}

.uij-sidebar-left.open {
    transform: translateX(0);
}

/* Right Sidebar */
.uij-sidebar-right {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: 280px;
    background: var(--uij-bg-secondary, #333333);
    border-left: 1px solid var(--uij-border, #444444);
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1000;
    display: flex;
    flex-direction: column;
}

.uij-sidebar-right.open {
    transform: translateX(0);
}

/* Sidebar Header */
.uij-sidebar-header {
    padding: var(--uij-spacing-md, 16px) var(--uij-spacing-lg, 24px);
    border-bottom: 1px solid var(--uij-border, #444444);
    background: var(--uij-bg-tertiary, #444444);
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 64px;
}

.uij-sidebar-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--uij-text-primary, #eeeeee);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
}

/* Sidebar Content */
.uij-sidebar-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--uij-spacing-md, 16px);
}

.uij-sidebar-content::-webkit-scrollbar {
    width: 4px;
}

.uij-sidebar-content::-webkit-scrollbar-track {
    background: var(--uij-bg-secondary, #333333);
}

.uij-sidebar-content::-webkit-scrollbar-thumb {
    background: var(--uij-bg-quaternary, #555555);
    border-radius: 2px;
}

/* Navigation Items */
.uij-nav-item {
    display: block;
    padding: var(--uij-spacing-sm, 8px) var(--uij-spacing-md, 16px);
    color: var(--uij-text-secondary, #cccccc);
    text-decoration: none;
    border-radius: var(--uij-radius-md, 8px);
    margin-bottom: var(--uij-spacing-xs, 4px);
    transition: var(--uij-transition-fast, 0.15s);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
    background: transparent !important;
}

.uij-nav-item:hover {
    background: var(--uij-bg-tertiary, #444444) !important;
    color: var(--uij-text-primary, #eeeeee);
}

.uij-nav-item.active {
    background: var(--uij-primary, #32CD32) !important;
    color: #000000;
    font-weight: 600;
}

.uij-nav-item.active:hover {
    background: var(--uij-primary, #32CD32) !important;
    opacity: 0.9;
}

/* Section Divider */
.uij-sidebar-divider {
    border: none;
    border-top: 1px solid var(--uij-border, #444444);
    margin: var(--uij-spacing-md, 16px) 0;
}

.uij-sidebar-section {
    margin-bottom: var(--uij-spacing-lg, 24px);
}

.uij-sidebar-section-title {
    font-size: 12px;
    color: var(--uij-text-disabled, #666666);
    opacity: 0.7;
    font-weight: 600;
    margin-bottom: var(--uij-spacing-sm, 8px);
    padding: 0 var(--uij-spacing-md, 16px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Toggle Buttons */
.uij-sidebar-toggle {
    position: fixed;
    top: var(--uij-spacing-md, 16px);
    width: 44px;
    height: 44px;
    background: transparent !important;
    border: none;
    border-radius: var(--uij-radius-md, 8px);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1001;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--uij-text-primary, #eeeeee);
}

.uij-sidebar-toggle:hover {
    background: rgba(68, 68, 68, 0.3) !important;
}

.uij-sidebar-toggle.active {
    background: rgba(50, 205, 50, 0.2) !important;
    color: var(--uij-primary, #32CD32);
}

.uij-sidebar-toggle-left {
    left: var(--uij-spacing-md, 16px);
}

.uij-sidebar-toggle-right {
    right: var(--uij-spacing-md, 16px);
}

/* Hamburger Icon */
.uij-hamburger {
    width: 20px;
    height: 16px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.uij-hamburger span {
    display: block;
    height: 2px;
    width: 100%;
    background: currentColor;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 1px;
}

.uij-sidebar-toggle.active .uij-hamburger span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
}

.uij-sidebar-toggle.active .uij-hamburger span:nth-child(2) {
    opacity: 0;
}

.uij-sidebar-toggle.active .uij-hamburger span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
}

/* Sidebar Close Button */
.uij-sidebar-close {
    background: transparent !important;
    border: none;
    color: var(--uij-text-primary, #eeeeee);
    cursor: pointer;
    padding: var(--uij-spacing-xs, 4px);
    border-radius: var(--uij-radius-sm, 4px);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-size: 24px;
    line-height: 1;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.uij-sidebar-close:hover {
    background: var(--uij-bg-secondary, #333333) !important;
    color: var(--uij-primary, #32CD32);
}

/* Overlay */
.uij-sidebar-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.uij-sidebar-overlay.show {
    opacity: 1;
    visibility: visible;
}

/* Content Push Effect */
body.left-sidebar-open .uij-main-content {
    margin-left: 280px;
}

body.right-sidebar-open .uij-main-content {
    margin-right: 280px;
}

/* Responsive */
@media (max-width: 768px) {
    .uij-sidebar-left,
    .uij-sidebar-right {
        width: 90vw;
        max-width: 320px;
    }

    body.left-sidebar-open .uij-main-content,
    body.right-sidebar-open .uij-main-content {
        margin-left: 0;
        margin-right: 0;
    }
}
</style>
