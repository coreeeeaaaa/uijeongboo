name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUDGET: 100

jobs:
  # 1. Build & Test (Gates)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install dependencies (if any)
      - name: Install Dependencies
        run: npm install

      # Build (Dummy script for now)
      - name: Build
        run: npm run build

      # Core-EEAA Gates (Simulated for now as scripts might be missing deps)
      - name: Budget Gate
        run: node scripts/core-eeaa/budget-check.js --budget=$BUDGET
      
      # Prepare Pages Artifact
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # 2. Deploy to Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4