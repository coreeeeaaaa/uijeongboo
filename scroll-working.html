<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스크롤 애니메이션 데모</title>
    <style>
        body {
            background: #222;
            color: #fff;
            font-family: system-ui;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: #32CD32;
            transform: translateY(-2px);
        }
        .demo-box {
            width: 100px;
            height: 100px;
            background: #32CD32;
            margin: 10px 0;
            border-radius: 8px;
            transition: all 0.6s ease;
        }
        .card:hover .demo-box {
            transform: scale(1.1) rotate(5deg);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: auto;
        }
        .close {
            float: right;
            background: transparent;
            border: 1px solid #444;
            color: #fff;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
        .close:hover {
            border-color: #32CD32;
            color: #32CD32;
        }
        .demo-area {
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 40px;
            margin: 20px 0;
            text-align: center;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fade-demo {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }
        .fade-demo.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .parallax-demo {
            position: relative;
            height: 200px;
            overflow: hidden;
        }
        .parallax-bg {
            position: absolute;
            width: 120%;
            height: 120%;
            background: linear-gradient(45deg, #32CD32, #1a8a1a);
            border-radius: 10px;
        }
        .parallax-content {
            position: relative;
            z-index: 2;
            color: #000;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .magnetic-demo {
            width: 150px;
            height: 150px;
            background: #32CD32;
            border-radius: 8px;
            transition: transform 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 style="color: #32CD32; text-align: center;">스크롤 애니메이션 데모</h1>
    
    <div class="card" onclick="showDemo('fade')">
        <h3>페이드 인 효과</h3>
        <p>부드럽게 나타나는 애니메이션</p>
        <div class="demo-box"></div>
    </div>

    <div class="card" onclick="showDemo('parallax')">
        <h3>패럴랙스 효과</h3>
        <p>배경이 다른 속도로 움직이는 효과</p>
        <div class="demo-box"></div>
    </div>

    <div class="card" onclick="showDemo('magnetic')">
        <h3>마그네틱 효과</h3>
        <p>마우스에 반응하는 자석 효과</p>
        <div class="demo-box"></div>
    </div>

    <!-- 모달 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="close" onclick="closeModal()">×</button>
            <h2 id="modal-title">데모</h2>
            <div id="demo-area" class="demo-area">
                데모가 여기에 표시됩니다
            </div>
            <p id="modal-desc">설명이 여기에 표시됩니다</p>
        </div>
    </div>

    <script>
        function showDemo(type) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const area = document.getElementById('demo-area');
            const desc = document.getElementById('modal-desc');

            if (type === 'fade') {
                title.textContent = '페이드 인 효과 데모';
                area.innerHTML = '<div class="fade-demo" id="fadeEl">스크롤하면 나타납니다</div>';
                desc.textContent = '스크롤할 때 요소가 부드럽게 나타나는 효과입니다.';
                
                setTimeout(() => {
                    document.getElementById('fadeEl').classList.add('visible');
                }, 100);
            }
            else if (type === 'parallax') {
                title.textContent = '패럴랙스 효과 데모';
                area.innerHTML = '<div class="parallax-demo"><div class="parallax-bg" id="parallaxBg"></div><div class="parallax-content">패럴랙스 효과</div></div>';
                desc.textContent = '배경이 다른 속도로 움직여 깊이감을 만드는 효과입니다.';
                
                let offset = 0;
                const animate = () => {
                    offset += 0.5;
                    const bg = document.getElementById('parallaxBg');
                    if (bg) {
                        bg.style.transform = `translateX(${Math.sin(offset * 0.02) * 20}px)`;
                        requestAnimationFrame(animate);
                    }
                };
                animate();
            }
            else if (type === 'magnetic') {
                title.textContent = '마그네틱 효과 데모';
                area.innerHTML = '<div class="magnetic-demo" id="magneticEl">마우스를 올려보세요</div>';
                desc.textContent = '마우스 위치에 따라 요소가 자연스럽게 끌리는 효과입니다.';
                
                const el = document.getElementById('magneticEl');
                area.addEventListener('mousemove', (e) => {
                    const rect = area.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    const deltaX = (e.clientX - centerX) * 0.1;
                    const deltaY = (e.clientY - centerY) * 0.1;
                    el.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                });
                
                area.addEventListener('mouseleave', () => {
                    el.style.transform = 'translate(0, 0)';
                });
            }

            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // 모달 외부 클릭시 닫기
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        console.log('스크롤 애니메이션 데모가 로드되었습니다!');
    </script>
</body>
</html>
